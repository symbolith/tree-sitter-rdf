[package]
name = "tree-sitter-rdf11-turtle"
description = "RDF 1.1 Turtle grammar for tree-sitter"
version = "0.2.0"
authors = ["Gordian Dziwis"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "rdf11-turtle"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "git+https://github.com/gordiandziwis/tree-sitter-rdf.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
