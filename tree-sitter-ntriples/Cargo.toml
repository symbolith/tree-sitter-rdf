[package]
name = "tree-sitter-n-triples"
description = "N-Triples grammar for tree-sitter"
version = "0.0.1"
authors = ["Gordian Dziwis"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "n-triples"]
categories = ["parsing", "text-editors"]
repository = "git+https://github.com/gordiandziwis/tree-sitter-rdf.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.24.7"
